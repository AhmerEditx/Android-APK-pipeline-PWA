name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android
        env:
          IRONTRACK_URL: ${{ vars.IRONTRACK_URL }}

      - name: Install Android platform + build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Detect signing secrets
        id: detect
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release signing (only when secrets set)
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK (only when secrets set)
        if: steps.detect.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
        working-directory: android

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: irontrack-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore