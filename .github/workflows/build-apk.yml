name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android
        env:
          IRONTRACK_URL: ${{ vars.IRONTRACK_URL }}

      - name: Install Android platform + build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | head -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Detect signing secrets
        id: detect
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release signing (only when secrets set)
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK (only when secrets set)
        if: steps.detect.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
        working-directory: android

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: irontrack-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Compute release tag
        id: version
        run: echo "tag=v$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: IronTrack ${{ steps.version.outputs.tag }}
          body: |
            ## IronTrack

            A clean, no-nonsense gym tracker built for people who just want to log lifts, track progress, and stay consistent.

            **What's included:**
            - Workout logging with sets, reps, weight, and warm-up flags
            - Training plans (3–7 day splits, Push/Pull/Legs, custom plans)
            - Progress charts — body weight, volume, and per-exercise trends
            - Workout streaks and achievement badges
            - Today tab with live set-by-set performance comparison
            - Admin panel for managing members and messages
            - Installable as a PWA or Android app — no ads, no tracking

            **How to install:**
            1. Download `app-release.apk` below
            2. Open it on your Android phone
            3. If prompted, enable **Install unknown apps** for your browser
            4. Tap Install — done

            **Built with:** Next.js, Supabase, Tailwind CSS, Capacitor
            **Web app:** https://android-apk-pipeline-pwa.vercel.app

            ---
            Auto-built from commit ${{ github.sha }}.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk